<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>OTP 验证码生成器</title>
<style>
  :root {
    --c-green: #34d399;
    --c-yellow: #fbbf24;
    --c-red: #f87171;
    --c-primary: #6366f1;
    --c-cyan: #06b6d4;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    --mono: "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas,
            "Courier New", monospace;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font);
    color: #e2e8f0;
    background: linear-gradient(160deg, #0b1026 0%, #131a3a 38%, #0e2a4a 72%, #10324f 100%);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: rgba(99, 102, 241, .45); color: #fff; }

  /* ============ 背景：波浪 + 烟云 ============ */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .wave {
    position: absolute;
    left: 0;
    bottom: -2px;
    width: 200%;
    height: 100%;
    will-change: transform;
  }
  .wave-1 { animation: waveMove 16s linear infinite; opacity: .38; }
  .wave-2 { animation: waveMove 24s linear infinite reverse; opacity: .30; bottom: -26px; }
  .wave-3 { animation: waveMove 34s linear infinite; opacity: .22; bottom: -52px; }

  @keyframes waveMove {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  .smoke {
    position: absolute;
    border-radius: 50%;
    filter: blur(72px);
    will-change: transform, opacity;
    opacity: .38;
    animation: drift ease-in-out infinite alternate;
  }
  .smoke-1 {
    width: 440px; height: 440px; left: 6%;  top: 8%;
    background: radial-gradient(circle, rgba(99, 102, 241, .60), transparent 70%);
    animation-duration: 24s;
  }
  .smoke-2 {
    width: 380px; height: 380px; right: 4%; top: 22%;
    background: radial-gradient(circle, rgba(6, 182, 212, .50), transparent 70%);
    animation-duration: 30s;
    animation-delay: -8s;
  }
  .smoke-3 {
    width: 520px; height: 520px; left: 20%; top: 48%;
    background: radial-gradient(circle, rgba(168, 85, 247, .40), transparent 70%);
    animation-duration: 36s;
    animation-delay: -14s;
  }
  .smoke-4 {
    width: 360px; height: 360px; right: 12%; top: 62%;
    background: radial-gradient(circle, rgba(56, 189, 248, .45), transparent 70%);
    animation-duration: 26s;
    animation-delay: -5s;
  }

  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); opacity: .28; }
    50%  { opacity: .45; }
    100% { transform: translate(70px, -90px) scale(1.18); opacity: .32; }
  }

  /* ============ 布局 ============ */
  .app {
    position: relative;
    z-index: 1;
    max-width: 520px;
    margin: 0 auto;
    padding: 18px 16px 36px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .app-header { text-align: center; margin-bottom: 2px; }
  .app-title {
    margin: 0 0 8px;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #a5b4fc 0%, #67e8f9 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .app-sub { margin: 0; font-size: 13px; color: rgba(226, 232, 240, .66); }

  /* ============ 毛玻璃卡片 ============ */
  .card {
    background: rgba(255, 255, 255, .07);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    backdrop-filter: blur(18px) saturate(150%);
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 22px;
    box-shadow: 0 8px 32px rgba(2, 6, 23, .28);
    padding: 14px;
  }

  .card-title {
    margin: 0 0 9px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    color: rgba(226, 232, 240, .78);
  }

  /* ============ 输入区 ============ */
  .input-row { display: flex; gap: 10px; }
  #secretInput {
    flex: 1;
    min-width: 0;
    width: 100%;
    background: rgba(255, 255, 255, .09);
    border: 1px solid rgba(255, 255, 255, .16);
    border-radius: 14px;
    padding: 13px 14px;
    color: #f1f5f9;
    font-size: 14px;
    font-family: var(--mono);
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  #secretInput:focus {
    border-color: rgba(129, 140, 248, .75);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, .25);
  }
  #secretInput::placeholder { color: rgba(226, 232, 240, .38); font-family: var(--font); }

  .input-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: nowrap; justify-content: flex-start; }
  .input-actions.all-shown { justify-content: space-between; }
  .input-actions .btn { flex: 0 0 auto; padding: 10px 12px; font-size: 13px; white-space: nowrap; text-align: center; }

  /* ============ 按钮 ============ */
  .btn {
    appearance: none;
    border: none;
    cursor: pointer;
    border-radius: 13px;
    padding: 11px 16px;
    font-size: 14px;
    font-weight: 600;
    font-family: var(--font);
    transition: transform .15s, box-shadow .2s, opacity .2s, filter .2s;
    color: #e2e8f0;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: translateY(0) scale(.98); }
  .btn:disabled { opacity: .4; cursor: not-allowed; filter: grayscale(.7); }

  .btn-primary {
    background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
    color: #fff;
    box-shadow: 0 6px 18px rgba(99, 102, 241, .35);
  }
  .btn-primary:hover:not(:disabled) { box-shadow: 0 8px 24px rgba(99, 102, 241, .5); }

  .btn-glass {
    background: rgba(255, 255, 255, .1);
    border: 1px solid rgba(255, 255, 255, .2);
  }

  #copyNextBtn, #copyBothBtn {
    padding: 13px 18px;
    font-size: 16px;
  }
  .code-block .btn { margin-top: 8px; }
  .next-actions { margin-top: 8px; }

  /* ============ 验证码显示区 ============ */
  .code-card { text-align: center; padding: 16px 14px 14px; }
  .code-block { margin-top: 14px; }

  .code-row {
    display: flex;
    justify-content: center;
    align-items: center;
  }
  /* 数字 + 时钟的包裹层：相对定位，让时钟能「贴着数字右侧」绝对定位，而数字本身在模块内居中 */
  .code-value { position: relative; display: inline-block; }
  /* 时钟脱离正常流，定位于数字右缘外 22px，垂直与 6 位数字对齐（不占居中空间） */
  .code-value .countdown-wrap {
    position: absolute;
    left: 100%;
    top: 50%;
    transform: translateY(-50%);
    margin-left: 22px;
  }
  .code-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .code-row .current-label,
  .ring-caption {
    font-size: 11.5px;
    letter-spacing: 2px;
    color: rgba(226, 232, 240, .58);
    white-space: nowrap;
    margin-bottom: 0;
  }

  .code-label {
    display: block;
    font-size: 11.5px;
    letter-spacing: 3px;
    color: rgba(226, 232, 240, .58);
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .code-digits {
    font-family: var(--mono);
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 8px;
    color: #fff;
    text-shadow: 0 0 26px rgba(99, 102, 241, .55);
    line-height: 1.15;
  }
  .code-digits-next {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 7px;
    color: rgba(226, 232, 240, .72);
    line-height: 1.2;
  }

  /* ============ 倒计时环（置于验证码数字右侧） ============ */
  .countdown-wrap {
    position: relative;
    width: 54px;
    height: 54px;
    flex: 0 0 auto;
  }
  .ring { width: 100%; height: 100%; display: block; }
  .ring-bg { fill: none; stroke: rgba(255, 255, 255, .09); stroke-width: 9; }
  .ring-circle {
    fill: none;
    stroke-width: 9;
    stroke-linecap: round;
    transition: stroke .5s ease, stroke-dashoffset .25s linear;
  }
  .countdown-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .countdown-num {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 700;
    line-height: 1;
    color: #fff;
    transition: color .5s ease;
  }
  .countdown-sub {
    font-size: 8px;
    line-height: 1;
    margin-top: 2px;
    letter-spacing: 1px;
    color: rgba(255, 255, 255, .75);
    transition: color .5s ease;
  }

  /* ============ 复制当前验证码（主按钮：铺满 + 优雅流动渐变 + 右侧倒计时环） ============ */
  .copy-current {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    width: 100%;
    padding: 14px 16px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-top: 14px;
    color: #fff;
    border: none;
    background: linear-gradient(120deg, #6d5ef0, #22a7d6, #8b5cf6, #6d5ef0);
    background-size: 300% 300%;
    box-shadow: 0 8px 24px rgba(99, 102, 241, .40);
    animation: ctaGradient 3.2s ease infinite, ctaGlow 3.4s ease-in-out infinite;
  }
  .copy-current .cc-label { white-space: nowrap; }
  .copy-current .countdown-wrap { width: 62px; height: 62px; flex: 0 0 auto; }
  .copy-current .ring-bg { stroke: rgba(255, 255, 255, .28); }
  .copy-current .ring-circle { stroke-width: 9; }
  .copy-current .countdown-num { font-size: 18px; font-weight: 700; }
  .copy-current:disabled {
    animation: none;
    opacity: .5;
    cursor: not-allowed;
    background: linear-gradient(120deg, #6366f1, #06b6d4);
  }
  @keyframes ctaGradient {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes ctaGlow {
    0%, 100% { box-shadow: 0 8px 22px rgba(99, 102, 241, .42); }
    50%      { box-shadow: 0 11px 32px rgba(34, 167, 214, .60); }
  }

  [data-color="green"]  .ring-circle   { stroke: var(--c-green); }
  [data-color="green"]  .countdown-num,
  [data-color="green"]  .countdown-sub { color: var(--c-green); }
  [data-color="yellow"] .ring-circle   { stroke: var(--c-yellow); }
  [data-color="yellow"] .countdown-num,
  [data-color="yellow"] .countdown-sub { color: var(--c-yellow); }
  [data-color="red"]    .ring-circle   { stroke: var(--c-red); }
  [data-color="red"]    .countdown-num,
  [data-color="red"]    .countdown-sub { color: var(--c-red); }

  /* ============ 操作区 ============ */
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }

  /* ============ 二维码展示区（展开/收缩过渡） ============ */
  .qr-card {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    text-align: center;
    padding: 0 20px;
    pointer-events: none;
    transition: max-height .4s ease, opacity .4s ease, padding .4s ease;
  }
  .qr-card.visible {
    max-height: 520px;
    opacity: 1;
    padding: 20px;
    pointer-events: auto;
  }
  .qr-hint { font-size: 12px; color: rgba(226, 232, 240, .55); margin-bottom: 14px; }
  .qr-box {
    display: inline-block;
    background: #fff;
    border-radius: 16px;
    padding: 10px;
    margin: 0 auto 16px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, .35);
  }
  #qrPreview svg { display: block; width: 220px; height: 220px; }
  .qr-toast-anchor { height: 0; }

  /* ============ Toast ============ */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%) translateY(18px);
    background: rgba(15, 23, 42, .88);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    color: #f1f5f9;
    padding: 11px 20px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .2);
    box-shadow: 0 12px 34px rgba(0, 0, 0, .4);
    font-size: 13.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
    z-index: 60;
    max-width: 88vw;
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error   { border-color: rgba(248, 113, 113, .65); }
  #toast.success { border-color: rgba(52, 211, 153, .65); }

  /* ============ 响应式 ============ */
  @media (max-width: 460px) {
    .app { padding: 16px 12px 36px; gap: 10px; }
    .code-digits { font-size: 36px; letter-spacing: 6px; }
    .code-digits-next { font-size: 22px; letter-spacing: 5px; }
    .copy-current .countdown-wrap { width: 54px; height: 54px; }
    .copy-current .countdown-num { font-size: 16px; }
    .code-row { flex-direction: column; gap: 12px; }
    .code-value { display: flex; flex-direction: column; align-items: center; }
    .code-value .countdown-wrap { position: static; transform: none; left: auto; top: auto; margin-left: 0; margin-top: 10px; }
    .btn-row { flex-direction: column; }
    .btn-row.next-actions { flex-direction: row; }
    .input-row { flex-direction: column; }
    .input-actions { flex-wrap: wrap; }
    .card { padding: 12px; }
  }

  /* ============ 隐私声明 + 离线下载模块（与上方卡片一致的玻璃卡片） ============ */
  .privacy-card {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
  }
  .ai-btn {
    position: relative; padding: 2px; background: transparent; border: none;
    cursor: pointer; border-radius: 22px; display: inline-flex; align-items: center;
    justify-content: center; overflow: hidden; transition: transform .2s; outline: none;
  }
  .ai-btn:active { transform: scale(0.96); }
  .ai-content {
    height: 44px; background: rgba(255, 255, 255, .1); color: #e2e8f0; padding: 0 24px;
    border-radius: 22px; font-size: 14px; font-weight: 700; z-index: 2;
    transition: background .3s, color .3s;
    letter-spacing: .04em; display: flex; align-items: center; white-space: nowrap;
  }
  .ai-btn:hover .ai-content { background: rgba(255, 255, 255, .16); }
  /* 跑马灯运行时：按钮底色与「复制当前验证码」一致的流动彩色渐变 */
  .ai-running .ai-content {
    color: #fff;
    background: linear-gradient(120deg, #6d5ef0, #22a7d6, #8b5cf6, #6d5ef0);
    background-size: 300% 300%;
    animation: aiGradient 3.2s ease infinite;
  }
  @keyframes aiGradient {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .ai-orbit {
    position: absolute; inset: 0; border-radius: 22px; padding: 3px;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }
  /* 第一次效果：conic 渐变 + 旋转（忽略圆角矩形上粗细不匀称的瑕疵） */
  .ai-gradient {
    position: absolute; width: 180%; height: 180%; top: -40%; left: -40%;
    background: conic-gradient(from var(--random-start, 0deg) at 50% 50%,
      #4285f4 0deg, #ffffff 24deg, #ffffff 64deg, #34a853 100deg, #fbbc05 160deg,
      #ea4335 200deg, #4285f4 240deg, #4285f4 360deg);
  }
  .ai-running .ai-gradient { animation: ai-rotate 1.5s linear infinite; }
  @keyframes ai-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .security-notice {
    display: none; text-align: left; font-size: 13px; color: rgba(226, 232, 240, .82);
    line-height: 1.6; padding: 16px 4px 0; width: 100%;
    box-sizing: border-box; overflow: hidden;
  }
  .security-notice.active { display: block; }

  @keyframes flyInLeft { from { opacity: 0; transform: translateX(-80px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes flyInRight { from { opacity: 0; transform: translateX(80px); } to { opacity: 1; transform: translateX(0); } }
  .info-line { opacity: 0; }
  .security-notice.active .info-line:nth-child(odd) { animation: flyInLeft .6s ease-out forwards; }
  .security-notice.active .info-line:nth-child(even) { animation: flyInRight .6s ease-out forwards; }
  .security-notice.active .info-line:nth-child(1) { animation-delay: .1s; }
  .security-notice.active .info-line:nth-child(2) { animation-delay: .25s; }
  .security-notice.active .info-line:nth-child(3) { animation-delay: .4s; }

  .kbd-key {
    display: inline-block; padding: 1px 5px; margin: 0 2px; font-family: Arial, sans-serif;
    font-size: 10px; font-weight: 600; color: #a5b4fc; background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 255, 255, .18); border-radius: 4px;
  }

  #downloadBtn {
    cursor: pointer; font-size: 26px; transition: all .3s ease;
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border-radius: 10px; filter: brightness(1);
    background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .2);
  }
  #downloadBtn:hover { filter: brightness(1.25); transform: translateY(-1px); }
  #downloadBtn.downloaded {
    font-size: 13px; font-weight: 700; color: var(--c-green);
    width: auto; padding: 0 10px; cursor: default; filter: none;
  }
</style>
</head>
<body>

  <!-- 波浪 + 烟云流动背景 -->
  <div class="bg" aria-hidden="true">
    <svg class="wave wave-1" viewBox="0 0 2880 320" preserveAspectRatio="none">
      <path fill="rgba(6,182,212,.55)"
        d="M0,150 C240,220 480,90 720,150 C960,210 1200,90 1440,150 C1680,220 1920,90 2160,150 C2400,210 2640,90 2880,150 L2880,320 L0,320 Z"/>
    </svg>
    <svg class="wave wave-2" viewBox="0 0 2880 320" preserveAspectRatio="none">
      <path fill="rgba(99,102,241,.55)"
        d="M0,180 C240,100 480,240 720,180 C960,110 1200,250 1440,180 C1680,100 1920,240 2160,180 C2400,110 2640,250 2880,180 L2880,320 L0,320 Z"/>
    </svg>
    <svg class="wave wave-3" viewBox="0 0 2880 320" preserveAspectRatio="none">
      <path fill="rgba(168,85,247,.45)"
        d="M0,130 C240,200 480,80 720,130 C960,190 1200,80 1440,130 C1680,200 1920,80 2160,130 C2400,190 2640,80 2880,130 L2880,320 L0,320 Z"/>
    </svg>
    <div class="smoke smoke-1"></div>
    <div class="smoke smoke-2"></div>
    <div class="smoke smoke-3"></div>
    <div class="smoke smoke-4"></div>
  </div>

  <main class="app">

    <!-- 标题区 -->
    <header class="app-header">
      <h1 class="app-title" id="appTitle">🔐 OTP 验证码生成器</h1>
      <p class="app-sub" id="appSub">粘贴密钥 / otpauth 链接，或直接 Ctrl+V 粘贴二维码图片</p>
    </header>

    <!-- 输入区 -->
    <section class="card">
      <h2 class="card-title">输入 OTP 信息</h2>
      <div class="input-row">
        <input id="secretInput" type="text" autocomplete="off" spellcheck="false"
               placeholder="直接在这里粘贴二维码图片自动解析 或 输入 otpauth://完整协议">
      </div>
      <div class="input-actions">
        <button id="pasteBtn" type="button" class="btn btn-glass">📋 读取剪贴板图片</button>
        <button id="fileBtn" type="button" class="btn btn-glass">🖼️ 选择图片</button>
        <button id="genQrBtn" type="button" class="btn btn-glass" style="display:none">🔍 查看二维码</button>
        <button id="clearBtn" type="button" class="btn btn-glass" style="display:none">🗑 清除</button>
        <input id="fileInput" type="file" accept="image/*" hidden>
      </div>
    </section>

    <!-- 重新生成的二维码展示区（输入模块区域，按钮下方；初始隐藏，点击后展开，5 秒后自动收缩） -->
    <section class="card qr-card" id="qrCard">
      <h2 class="card-title">二维码</h2>
      <p class="qr-hint">二维码由解析出的 otpauth 信息重新生成，仅在本页展示，不会保存</p>
      <div class="qr-box"><div id="qrPreview"></div></div>
      <div id="qrToastAnchor" class="qr-toast-anchor" aria-hidden="true"></div>
    </section>

    <!-- 大号验证码显示区 -->
    <section class="card code-card">
      <!-- 当前验证码：标签在上、数字居中；倒计时环作为数字的「右侧跟随」定位（垂直与 6 位数字对齐，数字在模块内居中） -->
      <div class="code-row">
        <div class="code-col">

    return;
  }

  state.busy = true;
  try {
    var current = await computeTotp(state.secret, {
      algorithm: state.algorithm, digits: state.digits, period: state.period, timestamp: now

    var next = await computeTotp(state.secret, {
      algorithm: state.algorithm, digits: state.digits, period: state.period,
      timestamp: now + state.period * 1000

    els.nextCode.textContent = next;
  } catch (err) {

    els.nextCode.textContent = '------';

}

  } catch (e) {
    // 降级：execCommand('copy')
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e2) {
      return false;
    }
  }
}

function hasCode(el) {
  return el.textContent && !/^-+$/.test(el.textContent);
}

async function onCopyCurrent() {
  if (!state.secret || !hasCode(els.currentCode)) {
    toast('暂无当前验证码可复制', 'error', els.copyCurrentBtn);
    return;
  }
  var text = els.currentCode.textContent.trim();
  var ok = await copyText(text);
  toast(ok ? '已复制当前验证码：' + text : '复制失败，请手动复制', ok ? 'success' : 'error', els.copyCurrentBtn);
}

async function onCopyNext() {
  if (!state.secret || !hasCode(els.nextCode)) {
    toast('暂无下一个验证码可复制', 'error', els.copyNextBtn);
    return;
  }
  var text = els.nextCode.textContent.trim();
  var ok = await copyText(text);
  toast(ok ? '已复制下一个验证码：' + text : '复制失败，请手动复制', ok ? 'success' : 'error', els.nextActions || els.copyNextBtn);
}

async function onCopyBoth() {
  if (!state.secret || !hasCode(els.currentCode) || !hasCode(els.nextCode)) {
    toast('暂无可复制的验证码', 'error', els.copyBothBtn);
    return;
  }
  var both = '当前验证码：' + els.currentCode.textContent.trim() + '，下一个验证码：' + els.nextCode.textContent.trim();
  var ok = await copyText(both);
  toast(ok ? '已复制：' + both : '复制失败，请手动复制', ok ? 'success' : 'error', els.nextActions || els.copyBothBtn);
}

/* ============================ 图片二维码解码（jsQR） ============================ */
function imageFileToRgba(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      try {
        var w = img.naturalWidth || img.width;
        var h = img.naturalHeight || img.height;
        var maxDim = Math.max(w, h);
        var scale = 1;
        if (maxDim < 400) scale = Math.min(3, Math.ceil(720 / maxDim)); // 小图放大提升识别率
        var cw = Math.round(w * scale);
        var ch = Math.round(h * scale);
        var canvas = document.createElement('canvas');
        canvas.width = cw;
        canvas.height = ch;
        var ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, cw, ch);
        var imageData = ctx.getImageData(0, 0, cw, ch);
        resolve({ data: imageData.data, width: cw, height: ch });
      } catch (e) {
        reject(e);
      } finally {
        URL.revokeObjectURL(url);
      }
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      reject(new Error('图片加载失败'));
    };
    img.src = url;
  });
}

async function decodeAndFill(file) {
  toast('正在解码二维码图片…', 'info');
  try {
    var rgba = await imageFileToRgba(file);
    var code = jsQR(rgba.data, rgba.width, rgba.height, { inversionAttempts: 'dontInvert' });
    if (!code || !code.data) {
      // 反色尝试一次，提高深底浅码识别率
      code = jsQR(rgba.data, rgba.width, rgba.height, { inversionAttempts: 'attemptBoth' });
    }
    if (!code || !code.data) throw new Error('未能从图片中识别出二维码');
    var text = String(code.data).trim();
    if (!text) throw new Error('二维码内容为空');
    els.input.value = text;
    applyText(text);
    toast('二维码识别成功：' + (text.length > 40 ? text.slice(0, 40) + '…' : text), 'success');
  } catch (err) {
    toast('图片解码失败：' + (err && err.message ? err.message : '未知错误'), 'error');
  }
}

function applyText(text) {
  try {
    var info = parseInput(text);
    applyInfo(info);
  } catch (err) {
    toast(err.message || '解析失败', 'error');
  }
}

/* 根据是否有有效 OTP 信息，显示 / 隐藏「查看二维码」「清除」按钮 */
function updateQrBtnVisibility() {
  var show = state.secret ? '' : 'none';
  if (els.genQrBtn) els.genQrBtn.style.display = show;
  if (els.clearBtn) els.clearBtn.style.display = show;
  // 仅当「查看二维码」「清除」两个按钮都出现时，才让四个按钮两端对齐输入框；
  // 否则（无 otpauth 输入时）按钮回到左侧原始位置，不右对齐。
  if (els.inputActions) els.inputActions.classList.toggle('all-shown', !!state.secret);
}

/* 清除输入框内容并重新加载页面（回到初始状态） */
function onClear() {
  try { localStorage.removeItem('otp_secret'); } catch (e) {}
  if (els.secretInput) els.secretInput.value = '';
  if (window.history && window.history.replaceState) {
    window.history.replaceState(null, '', window.location.pathname);
  }
  window.location.reload();
}

/* 实时解析：输入框每次输入（多一个字符）即重算，且不改写输入框、不写 hash，避免打断输入 */
function liveApply(text) {
  text = String(text || '').trim();
  if (!text) {
    state.secret = '';
    state.fromOtpauth = false;
    els.currentCode.textContent = '------';
    els.nextCode.textContent = '------';
    updateHeader();
    updateCopyButtons(Date.now());
    updateQrBtnVisibility();
    return;
  }
  try {
    var info = parseInput(text);
    base32Decode(info.secret); // 校验密钥可解码
    state.secret = info.secret.replace(/[\s\-]/g, '').toUpperCase().replace(/=+$/, '');
    state.issuer = info.issuer || '';
    state.account = info.account || '';
    state.algorithm = info.algorithm || 'SHA1';
    state.digits = info.digits || 6;
    state.period = info.period || 30;
    state.otpauthUrl = buildOtpauthUrl(info);
    state.fromOtpauth = !!info.fromOtpauth;
    updateHeader();
    updateQrBtnVisibility();
    refresh();
  } catch (e) {
    // 输入不完整或非法：清空展示，等待继续输入（不弹错误提示，避免打扰）
    state.secret = '';
    state.fromOtpauth = false;
    els.currentCode.textContent = '------';
    els.nextCode.textContent = '------';
    updateHeader();
    updateCopyButtons(Date.now());
    updateQrBtnVisibility();
  }
}

function handleParse() {
  var value = els.input.value.trim();
  if (!value) {
    toast('请输入 Base32 密钥或 otpauth:// 链接', 'error');
    return;
  }
  applyText(value);
}

/* ============================ 剪贴板图片读取 ============================ */
async function onPasteBtn() {
  try {
    if (navigator.clipboard && navigator.clipboard.read) {
      var items = await navigator.clipboard.read();
      var found = false;
      for (var i = 0; i < items.length; i++) {
        var type = items[i].types.find(function (t) { return t.indexOf('image/') === 0; });
        if (type) {
          var blob = await items[i].getType(type);
          found = true;
          decodeAndFill(blob);
          return;
        }
      }
      if (!found) toast('剪贴板中没有图片，也可以直接 Ctrl+V 粘贴', 'info');
    } else {
      toast('当前浏览器不支持读取剪贴板，请直接 Ctrl+V 粘贴图片', 'info');
    }
  } catch (err) {
    toast('读取剪贴板失败（可能缺少权限）：' + (err && err.message ? err.message : '未知错误'), 'error');
  }
}

/* ============================ 二维码生成（qrcode-generator） ============================ */
var qrHideTimer = null;
function showQrWithAutoHide() {
  // 重置计时：清除上一个 timer，重新展开并重启 5 秒倒计时
  if (qrHideTimer) { clearTimeout(qrHideTimer); qrHideTimer = null; }
  els.qrCard.classList.add('visible');
  qrHideTimer = setTimeout(function () {
    els.qrCard.classList.remove('visible');
    qrHideTimer = null;
  }, 5000);
}

function generateQr() {
  if (!state.secret) {
    toast('请先解析有效的 OTP 信息', 'error', els.genQrBtn);
    return;
  }
  // 已展开时再次点击 → 立即收起（取消自动收起计时）
  if (els.qrCard.classList.contains('visible')) {
    if (qrHideTimer) { clearTimeout(qrHideTimer); qrHideTimer = null; }
    els.qrCard.classList.remove('visible');
    return;
  }
  try {
    // 确保 UTF-8 字节编码（otpauth URL 已百分号编码为 ASCII，双保险）
    if (qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs['UTF-8']) {
      qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
    }
    var qr = qrcode(0, 'M'); // type 0 = 自动选择版本，M 纠错级别
    qr.addData(state.otpauthUrl, 'Byte');
    qr.make();
    var svg = qr.createSvgTag({ cellSize: 4, margin: 4, scalable: true });
    els.qrPreview.innerHTML = svg;
    showQrWithAutoHide();
    toast('二维码已重新生成（5 秒后自动收起）', 'success', els.qrToastAnchor, true);
  } catch (err) {
    toast('二维码生成失败：' + (err && err.message ? err.message : '未知错误'), 'error', els.qrToastAnchor, true);
  }
}

/* ============================ 隐私声明模块 + 离线下载 ============================ */
// 键盘打字机效果：逐字显示文本
function typeWriter(el, text, speed) {
  if (!el) return;
  el.textContent = '';
  var i = 0;
  var id = setInterval(function () {
    el.textContent += text.charAt(i);
    i++;
    if (i >= text.length) clearInterval(id);
  }, speed);
}

function enableSecurityBlock() {
  // 禁止右键菜单（防复制）与查看源码 / 开发者工具 / 打印
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'F12') e.preventDefault();
    if ((e.ctrlKey || e.metaKey) && ['s', 'u', 'p'].indexOf(e.key.toLowerCase()) !== -1) e.preventDefault();
  });
}

function setupPrivacy() {
  var trigger = document.getElementById('privacyTrigger');
  var notice = document.getElementById('downloadZone');
  var aiGradient = document.querySelector('.ai-gradient');

  function setRandomAngle() {
    if (aiGradient) aiGradient.style.setProperty('--random-start', (Math.floor(Math.random() * 360)) + 'deg');
  }
  function runAiAnimation() {
    if (!trigger) return;
    trigger.classList.remove('ai-running');
    void trigger.offsetWidth; // 强制重排以重启动画
    trigger.classList.add('ai-running');
    setTimeout(function () { if (trigger) trigger.classList.remove('ai-running'); setRandomAngle(); }, 1500);
  }

  if (trigger && notice) {
    setRandomAngle();
    var declSpan = trigger.querySelector('.ai-content span');
    if (declSpan) typeWriter(declSpan, '服务器不保存任何信息声明', 75); // 首次加载打字机效果
    setTimeout(runAiAnimation, 700); // 打开页面后执行一次随机彩色跑马灯（与打字效果衔接）
    trigger.addEventListener('mouseenter', function () {
      if (!notice.classList.contains('active')) notice.classList.add('active');
      runAiAnimation();
    });
    trigger.addEventListener('click', function () {
      notice.classList.toggle('active');
      runAiAnimation();
    });
  }

  // 根据屏幕宽高比调整声明按钮左右内边距，使圆角矩形在卡片内对称美观
  function adjustAiButtonPadding() {
    var aiContent = document.querySelector('.ai-content');
    if (!aiContent) return;
    var aspect = (window.screen.width) / (window.screen.height);
    var sidePadding = aspect < 1 ? 14 : 28;
    aiContent.style.padding = '0 ' + sidePadding + 'px';
  }
  adjustAiButtonPadding();
  window.addEventListener('resize', adjustAiButtonPadding);
}

function downloadPage() {
  var dlBtn = document.getElementById('downloadBtn');
  var dlText = document.getElementById('downloadText');
  if (dlBtn.classList.contains('downloaded')) return;

  var docClone = document.documentElement.cloneNode(true);
  // 移除隐私声明模块与（如有）书签提示：下载副本不含本模块
  var pRoot = docClone.querySelector('#privacyRoot');
  if (pRoot) pRoot.remove();
  var bTip = docClone.querySelector('#bookmarkTip');
  if (bTip) bTip.remove();

  // 注入当前 OTP 状态，使离线副本打开即可恢复，无需任何服务器
  var appScript = docClone.querySelector('#appScript');
  if (appScript) {
    var savedState = JSON.stringify({
      secret: state.secret || '',
      issuer: state.issuer || '',
      account: state.account || '',
      algorithm: state.algorithm || 'SHA1',
      digits: state.digits || 6,
      period: state.period || 30,
      otpauthUrl: state.otpauthUrl || ''
    });
    var marker = "'use strict';";
    var jsonStr = savedState.replace(/<\/(script)/gi, '<\\/$1');
    var payload = "\nvar SAVED_OTP_STATE = " + jsonStr + ";\n";
    var idx = appScript.innerHTML.indexOf(marker);
    if (idx !== -1) {
      appScript.innerHTML = appScript.innerHTML.slice(0, idx + marker.length) + payload + appScript.innerHTML.slice(idx + marker.length);
    } else {
      appScript.innerHTML = payload + appScript.innerHTML;
    }
  }

  var htmlContent = "<!DOCTYPE html>\n" + docClone.outerHTML;
  var blob = new Blob([htmlContent], { type: 'text/html' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = (state.issuer && state.issuer !== DEFAULT_ISSUER) ? ('OTP_' + state.issuer + '.html') : 'OTP_Authenticator.html';
  a.click();
  URL.revokeObjectURL(url);
  dlBtn.textContent = '已下载';
  dlBtn.classList.add('downloaded');
  if (dlText) dlText.style.opacity = '0.4';
}

/* ============================ 事件绑定与初始化 ============================ */
function init() {
  enableSecurityBlock();
  setupPrivacy();

  // 全局粘贴事件：捕获图片
  document.addEventListener('paste', function (e) {
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      if (item.kind === 'file' && item.type && item.type.indexOf('image/') === 0) {
        var file = item.getAsFile();
        if (file) {
          e.preventDefault();
          decodeAndFill(file);
          return;
        }
      }
    }
  });

  window.addEventListener('hashchange', loadFromHash);

  els.input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleParse();
    }
  });
  els.input.addEventListener('input', function () {
    liveApply(els.input.value);
  });
  els.input.addEventListener('blur', function () {
    if (els.input.value.trim()) handleParse();
  });

  els.pasteBtn.addEventListener('click', onPasteBtn);
  els.fileBtn.addEventListener('click', function () { els.fileInput.click(); });
  els.fileInput.addEventListener('change', function () {
    if (els.fileInput.files && els.fileInput.files[0]) {
      decodeAndFill(els.fileInput.files[0]);
    }
    els.fileInput.value = '';
  });

  els.copyCurrentBtn.addEventListener('click', onCopyCurrent);
  els.copyNextBtn.addEventListener('click', onCopyNext);
  els.copyBothBtn.addEventListener('click', onCopyBoth);
  els.genQrBtn.addEventListener('click', generateQr);
  if (els.clearBtn) els.clearBtn.addEventListener('click', onClear);

  if (!window.crypto || !window.crypto.subtle) {
    toast('当前环境不支持 Web Crypto API（需 HTTPS 或 localhost/file 打开）', 'error');
  }

  // 从保存状态（离线副本注入的 SAVED_OTP_STATE）或 URL hash 恢复
  if (typeof SAVED_OTP_STATE !== 'undefined' && SAVED_OTP_STATE && SAVED_OTP_STATE.secret) {
    try {
      var savedInfo = parseInput(
        (SAVED_OTP_STATE.otpauthUrl && /^otpauth:\/\//i.test(SAVED_OTP_STATE.otpauthUrl))
          ? SAVED_OTP_STATE.otpauthUrl
          : SAVED_OTP_STATE.secret
      );
      applyInfo(savedInfo);
    } catch (e) { /* 忽略，回退到 hash */ }
  } else if (location.hash && location.hash.length > 1) {
    loadFromHash();
  }
  updateQrBtnVisibility();

  // 页面加载后将焦点置于输入框（相当于已点击输入框，可立即输入或粘贴图片）
  if (els.input && els.input.focus) {
    try { els.input.focus(); } catch (e) { /* 某些内嵌环境可能禁止自动聚焦，忽略 */ }
  }

  // 立即刷新 + 每 250ms 刷新倒计时与验证码状态
  refresh();
  setInterval(refresh, 250);
}

init();
  </script>
